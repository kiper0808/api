volumes:
  minio1_data:
  minio2_data:
  minio3_data:
  minio4_data:
  minio5_data:
  minio6_data:
  minio7_data:
  minio8_data:
  minio9_data:
  minio10_data:

networks:
  karma8:
    name: karma8
    driver: bridge
    ipam:
      config:
        - subnet: 172.18.0.0/16

services:
  api:
    container_name: karma8-api
    build:
      context: ./
      dockerfile: build/Dockerfile.gateway
    ports:
      - "8080:80"
    environment:
      - SERVER_SWAGGER_ENABLED=${SERVER_SWAGGER_ENABLED}
      - ENV_NAME=${ENV_NAME}
      - API_VERSION=${API_VERSION}
      - FILE_STORAGE_SECRET=${FILE_STORAGE_SECRET}
      - MYSQL_SERVER=${MYSQL_SERVER}
      - MYSQL_DBNAME=${MYSQL_DBNAME}
      - REDIS_TYPE=${REDIS_TYPE}
      - REDIS_ADDR=${REDIS_ADDR}
    restart: on-failure
    networks:
      - karma8

  storage1:
    container_name: karma8-storage1
    build:
      context: ./
      dockerfile: build/Dockerfile.storage
    ports:
      - "8081:80"
    environment:
      - ENV_NAME=${ENV_NAME}
      - API_VERSION=${API_VERSION}
      - MYSQL_SERVER=${MYSQL_SERVER}
      - MYSQL_DBNAME=${MYSQL_DBNAME}
      - REDIS_TYPE=${REDIS_TYPE}
      - MINIO_STORAGE_HOST=${MINIO_STORAGE_1_HOST}
      - MINIO_STORAGE_ACCESS_KEY=${MINIO_STORAGE_ACCESS_KEY}
      - MINIO_STORAGE_SECRET_KEY=${MINIO_STORAGE_SECRET_KEY}
      - MINIO_STORAGE_BUCKET=${MINIO_STORAGE_BUCKET}
      - REDIS_ADDR=${REDIS_ADDR}
